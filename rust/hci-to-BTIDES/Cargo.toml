[package]
name = "hci-to-BTIDES"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI: convert a BTSnoop/btmon HCI log into a BTIDES JSON file."

[[bin]]
name = "hci-to-BTIDES"
path = "src/main.rs"

[dependencies]
BTIDES-model    = { path = "../BTIDES-model" }
BTIDES-btsnoop  = { path = "../BTIDES-btsnoop" }
BTIDES-bt       = { path = "../BTIDES-bt" }
BTIDES-hci      = { path = "../BTIDES-hci" }
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
